# Install once with:  pre-commit install
# Then these checks run automatically before every commit (and in CI).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: detect-private-key
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks          # blocks commits that contain API keys or tokens

  - repo: local
    hooks:
      - id: invisible-characters
        name: no invisible / bidirectional characters (Trojan Source)
        entry: python scripts/check_invisible_chars.py
        language: system
        types_or: [python, toml, yaml, markdown]
      - id: mypy
        name: mypy (strict)
        entry: mypy
        language: system
        types: [python]
        pass_filenames: false
