# Valkey / Redis settings for the TrustRAG server profile (counters only: call windows and login attempts).
# Why these: an explicit memory bound with noeviction (never silently drop a rate-limit counter; a full store makes
# writes fail, which TrustRAG treats as "storage unavailable" and refuses), and an append-only file fsynced every
# second so a restart loses at most about one second of counters.
appendonly yes
appendfsync everysec
maxmemory 64mb
maxmemory-policy noeviction

# The password is NOT in this file: it comes from a mounted secret file holding one line `requirepass <password>`.
include /run/secrets/redis_auth.conf
