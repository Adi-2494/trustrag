[project]
name = "trustrag"
version = "1.0.0"
description = "Hallucination-aware document Q&A: answers only from your PDFs, cites every page, fact-checks itself and scans documents for prompt injection."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { file = "LICENSE" }
authors = [{ name = "Adi-2494" }]
dependencies = [
    "anthropic==2.2.0",
    "streamlit==1.66.1",
    "chromadb==1.5.9",
    "langchain-text-splitters==1.1.3",
    "pypdf==6.21.2",
    "pypdfium2==5.14.0",
    "python-dotenv==1.2.4",
    "pydantic-settings==2.16.1",
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "python-multipart==0.0.32",
    "httpx==0.28.1",
    "rank-bm25==0.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "hypothesis==6.170.9",
    "ruff==0.17.2",
    "mypy==2.4.0",
    "pre-commit==4.7.0",
    "reportlab==5.1.0",  # generates the demo and evaluation PDFs
]

# ---------------------------------------------------------------------------- tools
[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["eval/corpus", "chroma_db"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PL"]
ignore = [
    "E501",     # line length is handled by `ruff format`; long prompt strings are deliberate
    "PLR0913",  # pipeline entry points legitimately take several arguments
    "PLR0917",  # the LLMClient call shape (model, system, prompt, max_tokens, effort) mirrors the Messages API
    "PLC0415",  # deliberate lazy imports keep heavy dependencies (ChromaDB, reportlab) off light code paths
    "PLR2004",  # small literal thresholds read better inline
    "RUF001", "RUF002", "RUF003",  # intentional non-ASCII (look-alike letters in the injection rules and tests)
    "S603", "S607",  # subprocess is how subscription mode reaches Claude Code; inputs are fixed argv lists
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR0915"]
"eval/**" = ["S101", "PLR0912", "PLR0915"]
"scripts/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "api"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["chromadb.*", "rank_bm25.*", "pypdfium2.*", "langchain_text_splitters.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.coverage.run]
source = ["src", "api"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
